<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BTT Sync</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .sync-status {
      padding: 15px;
      background: #f0f9ff;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .folder-item {
      padding: 15px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .folder-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .folder-icon {
      font-size: 24px;
    }
    .folder-name {
      flex: 1;
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔄 Bookmark Sync</h1>
    <button id="sync-now">Sync Now</button>
  </div>

  <div class="sync-status">
    <div id="status-text">Not synced yet</div>
    <div id="last-sync"></div>
  </div>

  <h2>📁 Folders</h2>
  <div id="folders-container"></div>

  <div class="actions">
    <button id="create-folder">Create Folder</button>
    <button id="export-bookmarks">Export</button>
    <button id="import-bookmarks">Import</button>
  </div>

  <input type="file" id="import-file" accept=".json" style="display: none;">

  <script src="js/sync.js"></script>
  <script src="js/folders.js"></script>
  <script>
    document.getElementById('sync-now').addEventListener('click', async () => {
      await syncManager.syncBookmarks();
      alert('Bookmarks synced successfully!');
    });

    document.getElementById('export-bookmarks').addEventListener('click', async () => {
      await syncManager.exportBookmarks();
    });

    document.getElementById('import-bookmarks').addEventListener('click', () => {
      document.getElementById('import-file').click();
    });

    document.getElementById('import-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        const text = await file.text();
        await syncManager.importBookmarks(text);
        alert('Bookmarks imported successfully!');
      }
    });
  </script>
</body>
</html>
